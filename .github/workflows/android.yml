name: Android debug and game checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Game logic checks
        run: node --test tests/v3*.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android SDK components
        # GitHub's Ubuntu image already supplies ANDROID_HOME and sdkmanager.
        # Avoid setup-android's unrelated command-line-tools download.
        run: |
          test -n "$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wendao-lingqi-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

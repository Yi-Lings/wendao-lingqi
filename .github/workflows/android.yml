name: Android debug and game checks
on:
  push:
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - 'tools/assemble-apk.py'
      - '.github/workflows/publish-apk.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Game logic checks
        run: node --test tests/v3*.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android SDK and pinned components
        run: |
          TASK_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK: $TASK_SDK_ROOT"
          test -d "$TASK_SDK_ROOT"
          echo "ANDROID_HOME=$TASK_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$TASK_SDK_ROOT" >> "$GITHUB_ENV"
          if test -f "$TASK_SDK_ROOT/platforms/android-35/android.jar" && test -x "$TASK_SDK_ROOT/build-tools/35.0.0/aapt2"; then
            echo 'Pinned Android 35 components already installed'
          else
            TASK_SDK_MANAGER="$TASK_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            test -x "$TASK_SDK_MANAGER"
            "$TASK_SDK_MANAGER" --sdk_root="$TASK_SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wendao-lingqi-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
name: Publish verified offline web preview

on:
  workflow_dispatch:

concurrency:
  group: wendao-web-preview-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-web-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify game logic
        run: npm test
      - name: Build offline HTML and ZIP
        run: python3 tools/build-web-preview.py --zip
      - name: Verify previously tested artifact bytes
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          expected = {
              'wendao-lingqi-preview.html': (86334378, '290b07b8fbd3148997a5c6c6e4de4fc93ddf30d1ab44397a134e42ba355d39b6'),
          }
          for name, (expected_size, expected_digest) in expected.items():
              path = Path('dist') / name
              raw = path.read_bytes()
              digest = sha256(raw).hexdigest()
              if len(raw) != expected_size or digest != expected_digest:
                  raise SystemExit(f'Artifact mismatch: {name}, bytes={len(raw)}, sha256={digest}')
              print(f'Verified {name}: {len(raw)} bytes, SHA-256 {digest}')
          name = 'wendao-lingqi-preview.zip'
          archive_path = Path('dist') / name
          with ZipFile(archive_path) as archive:
              assert set(archive.namelist()) == {'wendao-lingqi-preview.html', '试玩说明.txt'}
              assert archive.testzip() is None
              assert sha256(archive.read('wendao-lingqi-preview.html')).hexdigest() == expected['wendao-lingqi-preview.html'][1]
          # zlib versions can change the ZIP container while its HTML stays exact.
          digest = sha256(archive_path.read_bytes()).hexdigest()
          print(f'Verified ZIP contents; SHA-256 {digest}')
          (Path('dist') / (name + '.sha256')).write_text(digest + '  ' + name + '\n', encoding='utf-8')
          PY
      - name: Publish verified preview download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3.0.0 \
            dist/wendao-lingqi-preview.zip \
            dist/wendao-lingqi-preview.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

plugins { id 'com.android.application' }

android {
    namespace 'com.lingqi.game'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.lingqi.game'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
    sourceSets {
        main { assets.srcDirs = ['../../web'] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            minifyEnabled false
            // Deliberately unsigned. Use build-android.sh with the existing private key for upgrades.
        }
    }
}
